services:
  db:
    image: postgres:18.0
    container_name: expense-app-db
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - /volume1/docker/expense-app/db:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:15432:5432"
    networks:
      - expense_app_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: expense-app-2-web:0.1.0
    container_name: expense-app-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3002:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - expense_app_net

networks:
  expense_app_net:
    driver: bridge
