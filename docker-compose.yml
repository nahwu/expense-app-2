services:
  db:
    image: postgres:18.0
    container_name: expense-app-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DB_DATA_PATH}:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - expense_app_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: expense-app-2-web:0.1.0
    container_name: expense-app-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      BOOTSTRAP_USER_ID: ${BOOTSTRAP_USER_ID}
      BOOTSTRAP_USER_EMAIL: ${BOOTSTRAP_USER_EMAIL}
      BOOTSTRAP_USER_PASSWORD: ${BOOTSTRAP_USER_PASSWORD}
      BOOTSTRAP_USER_PASSWORD_HASH: ${BOOTSTRAP_USER_PASSWORD_HASH}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - expense_app_net

networks:
  expense_app_net:
    driver: bridge
